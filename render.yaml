# Render Blueprint: deploys the app as a Node web service with a disk for accounts and songs.
# In Render: New > Blueprint, pick this repository, then fill in the keys it asks for.
services:
  - type: web
    name: cadence-song-generator
    runtime: node
    plan: starter # persistent disks need a paid instance
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Entered by you in the Render dashboard, never stored in the repo. Leave unused ones empty.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SIGNUP_CODE
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: REQUIRE_LOGIN
        value: "true"
      - key: DAILY_SONGS_PER_USER
        value: "10"
      - key: VERSIONS_PER_REQUEST
        value: "2"
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
